[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["sync_labs"]
homepage = "https://gate.synclabs.team"
repository = "https://github.com/sync-labs-team/sync_gate"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
nvml-wrapper = "0.13"
windows-sys = "0.61"
nix = "0.31"
interprocess = "2.4"
