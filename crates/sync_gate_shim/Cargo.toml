[package]
name = "sync_gate_shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "sync_gate: the relay behind sync_gate_mcp"
rust-version.workspace = true

[lib]
name = "sync_gate_shim"

[[bin]]
name = "sync_gate_mcp"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6"
sync_gate_core = { path = "../sync_gate_core", features = ["ipc"] }
interprocess = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal"] }

[dev-dependencies]
sync_gate = { path = "../sync_gate" }
sync_gate_probe = { path = "../sync_gate_probe" }
sync_gated = { path = "../sync_gated" }
