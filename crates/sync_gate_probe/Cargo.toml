[package]
name = "sync_gate_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "sync_gate: machine measurement: memory, process-tree RSS and VRAM"
rust-version.workspace = true

[dependencies]
sync_gate_core = { path = "../sync_gate_core" }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nvml-wrapper = { workspace = true, optional = true }

[features]
nvidia = ["dep:nvml-wrapper"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal"] }
